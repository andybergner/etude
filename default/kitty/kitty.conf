# Etude – kitty

font_family      JetBrainsMono Nerd Font
font_size        11.0

window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam

# Transparenz kommt aus den Etude-Einstellungen (schreibt die Shell, lädt per SIGUSR1 neu)
dynamic_background_opacity yes
include etude-transparency.conf

# Farben (zinc, dark) – später erzeugt vom Theme-Generator
foreground #fafafa
background #09090b
selection_foreground #09090b
selection_background #e4e4e7
cursor #e4e4e7

color0  #18181b
color8  #52525b
color1  #f87171
color9  #fca5a5
color2  #4ade80
color10 #86efac
color3  #facc15
color11 #fde047
color4  #60a5fa
color12 #93c5fd
color5  #c084fc
color13 #d8b4fe
color6  #22d3ee
color14 #67e8f9
color7  #d4d4d8
color15 #fafafa

# include ~/.local/state/etude/theme/kitty.conf
