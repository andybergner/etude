# Einstellungen für limine-entry-tool (Paket limine-mkinitcpio-hook) – wird zu /etc/default/limine.
# install/config/limine.sh ersetzt @@CMDLINE@@ durch die Root-Partition dieses Computers
# (root=UUID=… rootflags=subvol=@ rw). Alles Weitere steht in /etc/limine-entry-tool.d/*.conf.
ESP_PATH="/boot"

KERNEL_CMDLINE[default]+="@@CMDLINE@@"
