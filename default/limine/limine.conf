# Etude-Bootmenü (Limine). Nur Aussehen und Verhalten – die Einträge darunter schreibt
# limine-update (limine-mkinitcpio-hook) bzw. limine-snapper-sync selbst.
# Alle Optionen: https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md
timeout: 2
quiet: yes
default_entry: 2
hash_mismatch_panic: no

interface_branding: Etude
interface_branding_color: fafafa
interface_help_color: a1a1aa
interface_help_color_bright: fafafa

# Farben wie die Shell (zinc)
term_background: 09090b
backdrop: 09090b
term_foreground: fafafa
term_foreground_bright: fafafa
term_background_bright: 27272a
term_palette: 09090b;ef4444;22c55e;eab308;3b82f6;a855f7;06b6d4;d4d4d8
term_palette_bright: 52525b;f87171;4ade80;facc15;60a5fa;c084fc;22d3ee;fafafa
