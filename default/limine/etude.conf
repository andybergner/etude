# Etude-Vorgaben für limine-entry-tool und limine-snapper-sync
# (install/config/limine.sh kopiert diese Datei nach /etc/limine-entry-tool.d/00-etude.conf)

# Name des Eintrags im Bootmenü – limine-snapper-sync sucht danach, darf sich nicht ändern
TARGET_OS_NAME="Etude"

# Stilles Booten: kein Text, kein blinkender Cursor
KERNEL_CMDLINE[default]+=" quiet loglevel=3 rd.udev.log_level=3 systemd.show_status=auto vt.global_cursor_default=0"

# „Notfall“-Eintrag mit dem großen Initramfs, andere Betriebssysteme (z. B. Windows) mit aufnehmen
ENABLE_LIMINE_FALLBACK=yes
FIND_BOOTLOADERS=yes
BOOT_ORDER="*, *fallback, Snapshots"

# Schnappschüsse im Bootmenü: snapper behält 5 (default/snapper/root), kurz nach einem
# neuen Schnappschuss sind es 6, bis snapper aufräumt
MAX_SNAPSHOT_ENTRIES=6

# btrfs-Aufteilung von Etude: System in @, Schnappschüsse im eigenen Subvolume @snapshots
ROOT_SUBVOLUME_PATH="/@"
ROOT_SNAPSHOTS_PATH="/@snapshots"
