# Baut Pakete aus dem AUR und legt sie ins Etude-Pacman-Repo (wie Omarchy es mit eigenem Repo
# macht) – damit der Installer sie ohne AUR-Helfer per pacman installieren kann.
# Welche Pakete: packaging/aur.packages
#
#   Manuell:  GitHub → Actions → aur → Run workflow
#   Per Tag:  git tag aur-2026.11.24 && git push origin aur-2026.11.24
#   Automatisch am 1. jedes Monats (Updates der Pakete)
name: aur

on:
  workflow_dispatch:
  push:
    tags: ['aur-*']
  schedule:
    - cron: '17 4 1 * *'

permissions:
  contents: write

concurrency:
  group: pacman-repo          # nie gleichzeitig mit release.yml an der Paketliste
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Prepare
        run: |
          pacman -Syu --noconfirm --needed git github-cli
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@v5

      - name: Build AUR packages
        run: |
          mkdir -p /tmp/out && chmod 777 /tmp/out
          # yay löst auch AUR-Abhängigkeiten auf; gebaute Pakete landen im Cache von yay
          sudo -u builder bash -euo pipefail -c '
            cd ~ && git clone --depth 1 https://aur.archlinux.org/yay-bin.git && cd yay-bin && makepkg -si --noconfirm
            grep -v "^[[:space:]]*#" "'"$GITHUB_WORKSPACE"'/packaging/aur.packages" | awk "NF { print \$1 }" > ~/list
            cat ~/list
            yay -S --noconfirm --needed --removemake --answerclean None --answerdiff None $(cat ~/list)
            find ~/.cache/yay -name "*.pkg.tar.zst" -exec cp {} /tmp/out/ \;
          '
          ls -la /tmp/out

      - name: Update pacman repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release view repo >/dev/null 2>&1 || \
            gh release create repo --title "Etude pacman repository" --latest=false \
              --notes "pacman.conf: [etude] / Server = https://github.com/$GH_REPO/releases/download/repo"
          mkdir -p /tmp/repo && cd /tmp/repo
          gh release download repo -p 'etude.db.tar.gz' -p 'etude.files.tar.gz' || true
          cp /tmp/out/*.pkg.tar.zst .
          # GitHub-Release-Dateinamen vertragen kein ":" (Epoch) – ersetzen wie GitHub es täte
          for f in *:*; do [ -e "$f" ] && mv "$f" "${f//:/.}"; done
          repo-add etude.db.tar.gz *.pkg.tar.zst
          rm -f etude.db etude.files
          cp etude.db.tar.gz etude.db
          cp etude.files.tar.gz etude.files
          gh release upload repo --clobber *.pkg.tar.zst etude.db etude.db.tar.gz etude.files etude.files.tar.gz
